<app-page-wrapper>
    <!-- Hero Section -->
    <section class="min-h-screen flex items-center justify-center px-6 pt-20">
      <div class="text-center max-w-4xl">
        <app-page-header [title]="title" [subtitle]="subtitle"></app-page-header>

        <!-- Description -->
        <div class="max-w-2xl mx-auto mb-16">
          <p class="text-gray-500 text-lg leading-relaxed font-light">
            {{ description }}
          </p>
        </div>

        <!-- Call to action -->
        <div class="inline-block">
          <div class="border border-gray-700 px-8 py-3 text-gray-400 tracking-widest text-sm">
            {{ ctaLabel }}
          </div>
        </div>
      </div>
    </section>

    <!-- Games Section -->
    <section class="py-20 px-6 border-t border-gray-900">
      <div class="container mx-auto">
        <h2 class="text-4xl font-thin text-center mb-16 tracking-wider text-gray-300">
          {{ sectionGamesTitle }}
        </h2>
        <app-games-grid [games]="games" [loginPrompt]="loginPrompt"></app-games-grid>
      </div>
    </section>

</app-page-wrapper>

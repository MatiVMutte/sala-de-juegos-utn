<div class="min-h-screen bg-black text-white overflow-hidden relative">
  <!-- Background subtle gradient -->
  <div class="absolute inset-0 bg-linear-to-b from-gray-900 via-black to-gray-950 opacity-50"></div>
  
  <!-- Floating particles effect -->
  <div class="absolute inset-0">
    <div class="absolute top-20 left-10 w-1 h-1 bg-white rounded-full opacity-20 animate-pulse"></div>
    <div class="absolute top-40 right-20 w-1 h-1 bg-white rounded-full opacity-30 animate-pulse delay-75"></div>
    <div class="absolute bottom-40 left-1/4 w-1 h-1 bg-white rounded-full opacity-25 animate-pulse delay-150"></div>
    <div class="absolute top-60 left-1/3 w-1 h-1 bg-white rounded-full opacity-20 animate-pulse delay-300"></div>
    <div class="absolute bottom-20 right-1/4 w-1 h-1 bg-white rounded-full opacity-35 animate-pulse delay-500"></div>
  </div>

  <!-- Main content -->
  <div class="relative z-10">
    <app-nav-bar></app-nav-bar>

    <!-- Hero Section -->
    <section class="min-h-screen flex items-center justify-center px-6 pt-20">
      <div class="text-center max-w-4xl">
        <!-- Main title with glitch effect -->
        <h1 class="text-6xl md:text-8xl mb-8 tracking-wider relative">
          <span class="relative inline-block font-light">
            {{ title }}
            <span class="blur-sm absolute inset-0 text-white opacity-20 animate-pulse animate-infinite">{{ title }}</span>
          </span>
        </h1>
        
        <!-- Subtitle -->
        <p class="text-xl md:text-2xl text-gray-400 mb-12 font-light tracking-wide leading-relaxed">
          {{ subtitle }}
        </p>

        <!-- Description -->
        <div class="max-w-2xl mx-auto mb-16">
          <p class="text-gray-500 text-lg leading-relaxed font-light">
            {{ description }}
          </p>
        </div>

        <!-- Call to action -->
        <div class="inline-block">
          <div class="border border-gray-700 px-8 py-3 text-gray-400 tracking-widest text-sm">
            EXPLORA LOS JUEGOS
          </div>
        </div>
      </div>
    </section>

    <!-- Games Section -->
    <section class="py-20 px-6 border-t border-gray-900">
      <div class="container mx-auto">
        <h2 class="text-4xl font-thin text-center mb-16 tracking-wider text-gray-300">
          JUEGOS DISPONIBLES
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 max-w-6xl mx-auto">
          @for (game of games; track game.title) {
            <app-game-card [game]="game"></app-game-card>
          }
        </div>

        <!-- Login prompt -->
        <div class="text-center mt-16">
          <p class="text-gray-600 text-sm tracking-wide">
            INICIA SESIÓN PARA ACCEDER A LOS JUEGOS
          </p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <app-footer></app-footer>
  </div>
</div>

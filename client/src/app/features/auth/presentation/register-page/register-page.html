<app-page-wrapper>
    <!-- Register Section -->
    <section class="min-h-screen flex items-center justify-center px-6 pt-20 pb-12">
      <div class="max-w-md w-full">
        <app-page-header [title]="title" [subtitle]="subtitle"></app-page-header>

        <!-- Form -->
        <form class="space-y-6">
          @for (field of fields; track field.label) {
            <div>
              <label class="block text-xs text-gray-500 tracking-widest mb-2">{{ field.label }}</label>
              <input
                [type]="field.type"
                [placeholder]="field.placeholder"
                class="w-full bg-transparent border border-gray-800 rounded-lg px-4 py-3 text-gray-200 placeholder-gray-700 focus:outline-none focus:border-gray-500 transition-colors duration-300"
              >
            </div>
          }

          <!-- Submit -->
          <button
            type="submit"
            class="w-full bg-white text-black py-3 rounded-lg tracking-widest text-sm font-medium hover:bg-gray-200 transition-colors duration-300"
          >
            {{ btnSubmit }}
          </button>
        </form>

        <!-- Login Link -->
        <div class="text-center mt-8">
          <p class="text-gray-600 text-sm tracking-wide">
            {{ hasAccountText }}
            <a
              routerLink="/login"
              class="text-gray-300 hover:text-white transition-colors duration-300 ml-2 underline"
            >
              {{ linkLogin }}
            </a>
          </p>
        </div>
      </div>
    </section>

</app-page-wrapper>

<div class="min-h-screen bg-black text-white overflow-hidden relative">
  <!-- Background subtle gradient -->
  <div class="absolute inset-0 bg-linear-to-b from-gray-900 via-black to-gray-950 opacity-50"></div>

  <!-- Main content -->
  <div class="relative z-10">
    <app-nav-bar></app-nav-bar>

    <!-- Register Section -->
    <section class="min-h-screen flex items-center justify-center px-6 pt-20 pb-12">
      <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-12">
          <h1 class="text-4xl md:text-5xl font-thin mb-4 tracking-wider text-gray-200">
            {{ title }}
          </h1>
          <p class="text-gray-500 tracking-wide">
            {{ subtitle }}
          </p>
        </div>

        <!-- Form -->
        <form class="space-y-6">
          <!-- Nombre -->
          <div>
            <label class="block text-xs text-gray-500 tracking-widest mb-2">NOMBRE</label>
            <input
              type="text"
              placeholder="Tu nombre"
              class="w-full bg-transparent border border-gray-800 rounded-lg px-4 py-3 text-gray-200 placeholder-gray-700 focus:outline-none focus:border-gray-500 transition-colors duration-300"
            >
          </div>

          <!-- Email -->
          <div>
            <label class="block text-xs text-gray-500 tracking-widest mb-2">EMAIL</label>
            <input
              type="email"
              placeholder="tu@correo.com"
              class="w-full bg-transparent border border-gray-800 rounded-lg px-4 py-3 text-gray-200 placeholder-gray-700 focus:outline-none focus:border-gray-500 transition-colors duration-300"
            >
          </div>

          <!-- Password -->
          <div>
            <label class="block text-xs text-gray-500 tracking-widest mb-2">CONTRASEÑA</label>
            <input
              type="password"
              placeholder="••••••••"
              class="w-full bg-transparent border border-gray-800 rounded-lg px-4 py-3 text-gray-200 placeholder-gray-700 focus:outline-none focus:border-gray-500 transition-colors duration-300"
            >
          </div>

          <!-- Confirm Password -->
          <div>
            <label class="block text-xs text-gray-500 tracking-widest mb-2">CONFIRMAR CONTRASEÑA</label>
            <input
              type="password"
              placeholder="••••••••"
              class="w-full bg-transparent border border-gray-800 rounded-lg px-4 py-3 text-gray-200 placeholder-gray-700 focus:outline-none focus:border-gray-500 transition-colors duration-300"
            >
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="w-full bg-white text-black py-3 rounded-lg tracking-widest text-sm font-medium hover:bg-gray-200 transition-colors duration-300"
          >
            CREAR CUENTA
          </button>
        </form>

        <!-- Login Link -->
        <div class="text-center mt-8">
          <p class="text-gray-600 text-sm tracking-wide">
            ¿Ya tienes cuenta?
            <a
              routerLink="/login"
              class="text-gray-300 hover:text-white transition-colors duration-300 ml-2 underline"
            >
              INICIAR SESIÓN
            </a>
          </p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <app-footer></app-footer>
  </div>
</div>

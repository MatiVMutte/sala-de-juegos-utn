<app-page-wrapper>
    <!-- Games Section -->
    <section class="min-h-screen flex flex-col items-center justify-center px-6 pt-20">
      <div class="max-w-6xl w-full">
        <app-page-header [title]="title" [subtitle]="subtitle"></app-page-header>
        <p class="text-gray-600 text-lg max-w-2xl mx-auto leading-relaxed text-center -mt-8 mb-16">
          {{ description }}
        </p>
        <app-games-grid [games]="games" [loginPrompt]="loginPrompt"></app-games-grid>
      </div>
    </section>

</app-page-wrapper>

<div class="min-h-screen bg-black text-white overflow-hidden relative">
  <!-- Background subtle gradient -->
  <div class="absolute inset-0 bg-linear-to-b from-gray-900 via-black to-gray-950 opacity-50"></div>
  
  <!-- Main content -->
  <div class="relative z-10">
    <app-nav-bar></app-nav-bar>

    <!-- Games Section -->
    <section class="min-h-screen flex flex-col items-center justify-center px-6 pt-20">
      <div class="max-w-6xl w-full">
        <!-- Header -->
        <div class="text-center mb-16">
          <h1 class="text-6xl md:text-8xl font-thin mb-4 tracking-wider text-gray-200">
            {{ title }}
          </h1>
          <p class="text-xl md:text-2xl text-gray-500 tracking-wide mb-8">
            {{ subtitle }}
          </p>
          <p class="text-gray-600 text-lg max-w-2xl mx-auto leading-relaxed">
            {{ description }}
          </p>
        </div>

        <!-- Games Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 max-w-6xl mx-auto">
          @for (game of games; track game.title) {
            <app-game-card [game]="game"></app-game-card>
          }
        </div>

        <!-- Login prompt -->
        <div class="text-center mt-16">
          <p class="text-gray-600 text-sm tracking-wide">
            INICIA SESIÓN PARA ACCEDER A LOS JUEGOS
          </p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <app-footer></app-footer>
  </div>
</div>

<nav class="fixed top-0 left-0 right-0 z-50 border-b border-gray-800 bg-black/90 backdrop-blur-sm">
  <div class="container mx-auto px-6 py-4">
    <div class="flex items-center justify-between">
      <div class="text-2xl font-thin tracking-widest text-white opacity-90">
        {{ brandName }}
      </div>
      <div class="flex space-x-8">
        @for (item of menuItems; track item.route) {
          <a [routerLink]="item.route" class="text-gray-400 hover:text-white transition-colors duration-300 text-sm tracking-wide cursor-pointer">{{ item.label }}</a>
        }
      </div>
    </div>
  </div>
</nav>

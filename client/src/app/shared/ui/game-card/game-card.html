<div class="group relative border border-gray-800 p-8 hover:border-gray-600 transition-all duration-500"
  [class.cursor-pointer]="!!game.route"
  [class.cursor-default]="!game.route">
  <div class="absolute inset-0 bg-linear-to-b from-transparent to-gray-900 opacity-0 group-hover:opacity-20 transition-opacity duration-500"></div>
  <div class="relative z-10">
    <div class="w-16 h-16 border border-gray-700 mb-6 flex items-center justify-center text-gray-500">
      @if (game.icon === 'hangman') {
        <!-- Gallows silhouette -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="22" x2="20" y2="22"/>
          <line x1="8" y1="22" x2="8" y2="2"/>
          <line x1="8" y1="2" x2="16" y2="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <circle cx="16" cy="8" r="2"/>
          <line x1="16" y1="10" x2="16" y2="15"/>
          <line x1="13" y1="12" x2="19" y2="12"/>
          <line x1="16" y1="15" x2="13" y2="19"/>
          <line x1="16" y1="15" x2="19" y2="19"/>
        </svg>
      }
      @if (game.icon === 'cards') {
        <!-- Playing cards -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="13" height="16" rx="2"/>
          <path d="M8 10 L8.5 8.5 L9 10 L10.5 10 L9.3 11 L9.7 12.5 L8.5 11.5 L7.3 12.5 L7.7 11 L6.5 10 Z" fill="currentColor" stroke="none"/>
          <rect x="9" y="3" width="13" height="16" rx="2" class="opacity-50"/>
        </svg>
      }
      @if (game.icon === 'goal') {
        <!-- Soccer ball / target -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <polygon points="12 8 14.5 11 12 14 9.5 11" fill="currentColor" stroke="none"/>
          <line x1="12" y1="3" x2="12" y2="8"/>
          <line x1="12" y1="14" x2="12" y2="21"/>
          <line x1="3" y1="12" x2="9.5" y2="11"/>
          <line x1="14.5" y1="11" x2="21" y2="12"/>
        </svg>
      }
      @if (game.icon === 'trivia') {
        <!-- Question mark -->
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.5 9a3 3 0 0 1 5.2 1c0 2-3 3-3 3"/>
          <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
        </svg>
      }
    </div>
    <h3 class="text-xl font-thin mb-3 tracking-wide text-gray-200">{{ game.title }}</h3>
    <p class="text-gray-400 text-sm leading-relaxed">{{ game.description }}</p>
    <div class="mt-6">
      @if (game.route) {
        <a [routerLink]="game.route" class="text-xs tracking-widest text-gray-400 hover:text-white border-b border-gray-700 hover:border-gray-400 pb-px transition-colors duration-300">JUGAR &rarr;</a>
      } @else {
        <span class="text-xs tracking-widest text-gray-700">PRÓXIMAMENTE</span>
      }
    </div>
  </div>
</div>
